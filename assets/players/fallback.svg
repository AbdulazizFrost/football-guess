<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0b1120" />
    </linearGradient>
    <radialGradient id="pitchGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="jerseyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="500" rx="16" fill="url(#bgGrad)" />

  <!-- Stadium pitch circle -->
  <circle cx="200" cy="230" r="160" fill="url(#pitchGlow)" />
  <circle cx="200" cy="230" r="120" fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.3" />
  <circle cx="200" cy="230" r="45" fill="none" stroke="#10b981" stroke-width="2" opacity="0.4" />

  <!-- Stylized Jersey Silhouette -->
  <g transform="translate(110, 120)">
    <!-- Collar & Shoulders -->
    <path d="M 40,30 L 70,10 L 110,10 L 140,30 L 180,60 L 150,110 L 130,95 L 130,220 L 50,220 L 50,95 L 30,110 L 0,60 Z" 
          fill="url(#jerseyGrad)" stroke="#60a5fa" stroke-width="3" />
    <!-- V-neck collar -->
    <polygon points="70,10 90,45 110,10" fill="#1e293b" stroke="#93c5fd" stroke-width="2" />
    <!-- Number 10 on Jersey -->
    <text x="90" y="160" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="-2">⚽</text>
  </g>

  <!-- Mystery Banner -->
  <rect x="60" y="380" width="280" height="48" rx="24" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
  <text x="200" y="411" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#f8fafc" text-anchor="middle" letter-spacing="1">
    MYSTERY FOOTBALLER
  </text>
  <text x="200" y="450" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#94a3b8" text-anchor="middle">
    GUESS THE PLAYER
  </text>
</svg>
